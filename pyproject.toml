[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hook-matcher-probe"
version = "0.1.0"
description = "Static probe for Claude Code hook matchers that can never fire: detects matcher-vs-permission semantic divergence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["claude-code", "hooks", "developer-tools", "static-analysis"]

[project.scripts]
probe = "hook_matcher_probe.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/hook-matcher-probe"

[tool.setuptools.packages.find]
where = ["src"]
